<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Небесный путь — авиатрекер</title>
<meta name="description" content="Небесный путь (Skypath): наглядное отслеживание авиарейсов на карте мира. Демонстрационная модель.">
<script>try{var _t=localStorage.getItem('sp_theme');if(_t==='light'||_t==='dark')document.documentElement.dataset.theme=_t;var _l=localStorage.getItem('sp_lang');if(_l==='ru'||_l==='en')document.documentElement.lang=_l}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root,[data-theme="dark"]{
  --bg:#150F0B;--surface:#221912;--surface-2:#2B2018;--surface-3:#36281E;
  --line:rgba(247,235,220,.08);--line-2:rgba(247,235,220,.15);
  --text:#F7EBDC;--muted:#BDA892;--faint:#8E7966;
  --intl:#FFB45E;--dom:#7FD8C0;--sel:#FF6A4D;--accent:#FFB45E;--accent-ink:#1E140C;
  --ocean:#100B08;--land:#2A1F17;--coast:#433226;--grid:rgba(255,180,94,.055);--airport:#E9D6BF;
  --veil:21,15,11;--glass:rgba(34,25,18,.74);
  --shadow:0 14px 40px rgba(0,0,0,.38);
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#FAF5EE;--surface:#FFFFFF;--surface-2:#F3EBE0;--surface-3:#E9DDCD;
  --line:rgba(70,45,20,.09);--line-2:rgba(70,45,20,.17);
  --text:#2A1D14;--muted:#6E5A49;--faint:#9A8572;
  --intl:#D27416;--dom:#1F8E76;--sel:#E0452A;--accent:#D27416;--accent-ink:#FFF8F0;
  --ocean:#ECE3D6;--land:#FCF8F2;--coast:#D6C3AC;--grid:rgba(120,80,40,.08);--airport:#6E5A49;
  --veil:250,245,238;--glass:rgba(255,255,255,.82);
  --shadow:0 14px 40px rgba(90,60,30,.14);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;transition:background .3s,color .3s}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.tn{font-variant-numeric:tabular-nums}
.c-intl{color:var(--intl)}.c-dom{color:var(--dom)}.c-sel{color:var(--sel)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:50;min-height:64px;display:flex;align-items:center;gap:18px;padding:0 20px;background:rgba(var(--veil),.84);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.logo{width:34px;height:34px;flex:none}
.brand-name{display:flex;flex-direction:column;line-height:1.1}
.brand-name b{font-family:Unbounded,Manrope,sans-serif;font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand-name small{font-size:10.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.tabs{display:flex;gap:2px;flex:1;justify-content:center;overflow-x:auto;scrollbar-width:none;padding:4px 0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;padding:8px 15px;border-radius:999px;color:var(--muted);font-weight:700;font-size:14px;white-space:nowrap;transition:background .2s,color .2s;position:relative}
.tabs button:hover{color:var(--text);background:var(--surface-2)}
.tabs button[aria-selected="true"]{color:var(--text);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.tabs button[aria-selected="true"]::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:2px}
.ctrls{display:flex;align-items:center;gap:10px;flex:none}
.demo{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent);cursor:help;white-space:nowrap}
.demo i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:999px;color:var(--muted);font-size:12.5px;font-weight:700;white-space:nowrap;transition:background .2s,color .2s}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18),inset 0 0 0 1px var(--line-2)}
.seg.full{display:flex}.seg.full button{flex:1;padding:7px 8px}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--text);padding:0;flex:none;transition:background .2s}
.icon-btn:hover{background:var(--surface-3)}
.icon-btn svg{width:17px;height:17px}
[data-theme="dark"] .i-sun{display:none}[data-theme="light"] .i-moon{display:none}

/* ---------- buttons, pills ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:12px 22px;font-weight:800;font-size:15px;border:1px solid transparent;text-decoration:none;transition:transform .15s,filter .2s,background .2s,border-color .2s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:rgba(var(--veil),.35);border-color:var(--line-2);color:var(--text)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.sm{padding:8px 14px;font-size:13px}
.btn[aria-pressed="true"]{background:color-mix(in srgb,var(--sel) 16%,transparent);border-color:color-mix(in srgb,var(--sel) 50%,transparent);color:var(--sel)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-cruise{color:var(--dom);background:color-mix(in srgb,var(--dom) 13%,transparent)}
.st-climb,.st-descent{color:var(--intl);background:color-mix(in srgb,var(--intl) 13%,transparent)}
.st-awaiting,.st-landed{color:var(--muted);background:var(--surface-2)}
.k-intl{color:var(--intl);background:color-mix(in srgb,var(--intl) 13%,transparent)}
.k-dom{color:var(--dom);background:color-mix(in srgb,var(--dom) 13%,transparent)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--dom);display:inline-block;box-shadow:0 0 0 0 color-mix(in srgb,var(--dom) 60%,transparent);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.bar{height:6px;border-radius:99px;background:var(--surface-3);position:relative;overflow:visible}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--sel) 55%,transparent),var(--sel))}

/* ---------- home ---------- */
.hero{position:relative;min-height:calc(100dvh - var(--hh,64px));overflow:hidden;display:flex;flex-direction:column}
#heroCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-veil{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(ellipse 60% 70% at 12% 38%,rgba(255,130,50,.10),transparent 70%),
  linear-gradient(90deg,rgba(var(--veil),.94) 0%,rgba(var(--veil),.72) 38%,rgba(var(--veil),.12) 72%,rgba(var(--veil),.05) 100%),
  linear-gradient(0deg,rgba(var(--veil),1) 0%,rgba(var(--veil),0) 34%)}
.hero-inner{position:relative;flex:1;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:48px;align-items:center;padding:56px clamp(16px,5vw,72px) 28px;max-width:1440px;width:100%;margin:0 auto}
.kicker{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.hero h1{font-family:Unbounded,Manrope,sans-serif;font-weight:600;font-size:clamp(34px,5.2vw,68px);line-height:1.04;letter-spacing:-.025em;margin:18px 0 20px}
.hero h1 em{font-style:normal;color:var(--accent)}
.lead{font-size:clamp(16px,1.35vw,18.5px);color:var(--muted);max-width:50ch;margin:0}
.cta{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.hero-stats{display:flex;gap:clamp(18px,3vw,40px);margin-top:42px;flex-wrap:wrap}
.hs b{display:block;font-family:Unbounded,Manrope,sans-serif;font-weight:600;font-size:clamp(22px,2.4vw,30px);line-height:1.2;font-variant-numeric:tabular-nums}
.hs span{color:var(--muted);font-size:13px;font-weight:600}
.note{display:flex;align-items:center;gap:8px;margin-top:22px;font-size:12.5px;color:var(--faint)}
.note svg{width:14px;height:14px;flex:none}
.now-card{background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line-2);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.now-head{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.now-flight{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.now-flight b{font-family:Unbounded,Manrope,sans-serif;font-size:22px;font-weight:600}
.now-flight span{color:var(--muted);font-size:13px;font-weight:600}
.now-route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:16px 0 14px}
.now-route .code{font-family:Unbounded,Manrope,sans-serif;font-size:24px;font-weight:600;line-height:1.1}
.now-route .city{font-size:12.5px;color:var(--muted);font-weight:600}
.now-route .r{text-align:right}
.now-arc{color:var(--sel);display:flex;align-items:center;gap:6px}
.now-arc::before,.now-arc::after{content:"";width:18px;border-top:1.5px dashed var(--line-2)}
.now-arc svg{width:18px;height:18px;fill:currentColor}
.now-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.now-stats span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.now-stats b{font-size:14px;font-variant-numeric:tabular-nums}
.now-card .btn{width:100%}
.feats{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:0 clamp(16px,5vw,72px) 32px;max-width:1440px;width:100%;margin:0 auto}
.feat{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:16px 18px;transition:transform .2s,border-color .2s}
.feat:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.feat .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);flex:none}
.feat .ico svg{width:19px;height:19px}
.feat b{display:block;font-size:15px}
.feat span{display:block;font-size:13px;color:var(--muted);line-height:1.4;margin-top:2px}

/* ---------- map ---------- */
.map-layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;height:calc(100dvh - var(--hh,64px))}
.map-wrap{position:relative;background:var(--ocean);overflow:hidden;touch-action:none;min-height:0}
#mapCanvas{display:block;width:100%;height:100%;cursor:grab;outline:none}
#mapCanvas.drag{cursor:grabbing}
#mapCanvas.ptr{cursor:pointer}
#mapCanvas:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
.mc{position:absolute;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow)}
.zoom{top:14px;left:14px;display:flex;flex-direction:column;padding:3px}
.zoom button{width:36px;height:36px;border:0;background:none;border-radius:10px;display:grid;place-items:center;font-size:19px;font-weight:600;color:var(--text)}
.zoom button:hover{background:var(--surface-3)}
.zoom button svg{width:16px;height:16px}
.layers{top:14px;right:14px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 9px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;border:1px solid var(--line-2);user-select:none}
.chip:has(input:checked){color:var(--text);background:var(--surface-2)}
.chip input{accent-color:var(--accent);margin:0;width:14px;height:14px}
.speed-lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 2px}
.legend{bottom:14px;left:14px;padding:8px 12px;display:flex;gap:14px;font-size:12px;font-weight:700;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend svg{width:13px;height:13px}
.clock{bottom:14px;right:14px;padding:8px 12px;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.clock b{color:var(--text)}
.tip{position:absolute;pointer-events:none;z-index:5;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:8px 11px;font-size:12.5px;line-height:1.45;box-shadow:var(--shadow);white-space:nowrap;color:var(--muted)}
.tip b{color:var(--text)}
.side{border-left:1px solid var(--line);background:var(--bg);overflow-y:auto;display:flex;flex-direction:column;min-height:0}
.side-top{position:sticky;top:0;z-index:2;background:var(--bg);padding:16px 16px 14px;border-bottom:1px solid var(--line);display:grid;gap:12px}
.search{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line-2);border-radius:13px;padding:0 6px 0 13px;height:44px;transition:border-color .2s}
.search:focus-within{border-color:var(--accent)}
.search>svg{width:17px;height:17px;color:var(--muted);flex:none}
.search input{flex:1;background:none;border:0;color:var(--text);font:inherit;font-size:14.5px;outline:none;min-width:0;height:100%}
.search input::placeholder{color:var(--faint)}
.search input::-webkit-search-cancel-button{display:none}
.search .x{width:30px;height:30px;border:0;background:none;border-radius:8px;color:var(--muted);display:grid;place-items:center;padding:0}
.search .x:hover{background:var(--surface-2);color:var(--text)}
.search .x svg{width:14px;height:14px}
.air-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.air-stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.air-stats b{display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.air-stats span{font-size:11.5px;color:var(--muted);font-weight:600}
.dash{margin:16px 16px 4px;background:var(--surface);border:1px solid var(--line-2);border-radius:20px;padding:18px}
.dash-empty{text-align:center;padding:10px 6px 4px}
.dash-empty svg{width:40px;height:40px;fill:var(--accent);opacity:.85;transform:rotate(45deg);margin:4px 0 10px}
.dash-empty b{display:block;font-size:16px}
.dash-empty p{margin:6px 0 14px;color:var(--muted);font-size:13.5px}
.dash-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dash-num{font-family:Unbounded,Manrope,sans-serif;font-size:24px;font-weight:600;line-height:1.15}
.dash-air{color:var(--muted);font-size:13px;font-weight:600;margin-top:3px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
.route{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start;margin:16px 0 12px}
.ep .code{font-family:Unbounded,Manrope,sans-serif;font-size:26px;font-weight:600;line-height:1.1}
.ep .city{font-weight:700;font-size:13.5px;margin-top:2px}
.ep .cty{font-size:12px;color:var(--muted)}
.ep.r{text-align:right}
.route-mid{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:6px;color:var(--sel)}
.route-mid svg{width:20px;height:20px;fill:currentColor}
.route-mid small{color:var(--muted);font-size:11.5px;font-weight:700;white-space:nowrap}
.prog .bar{margin:4px 0 8px}
.prog .bar b{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--sel);box-shadow:0 0 0 4px color-mix(in srgb,var(--sel) 25%,transparent)}
.prog-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.prog-l b{color:var(--text)}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.tm{background:var(--surface-2);border-radius:13px;padding:10px}
.lbl{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.tm .big{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.25}
.tm .big small{font-size:10.5px;color:var(--muted);font-weight:700;margin-left:2px}
.tm .sub{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:13px;overflow:hidden;border:1px solid var(--line)}
.stats>div{background:var(--surface);padding:10px 12px}
.stats .v{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;margin-top:1px}
.stats .s{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.profile{margin-top:16px}
.prof-box{position:relative;height:64px;margin-top:6px;border-bottom:1px solid var(--line-2)}
.prof-box svg{width:100%;height:100%;display:block}
.prof-dot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--sel);box-shadow:0 0 0 3px var(--surface)}
.dash-actions{display:flex;gap:8px;margin-top:16px}
.dash-actions .btn{flex:1;padding:10px 12px;font-size:13px}
.list-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.flist{padding:0 10px 16px;display:grid;gap:2px}
.fi{display:grid;grid-template-columns:4px 1fr auto;column-gap:12px;row-gap:3px;align-items:center;text-align:left;border:0;background:none;border-radius:12px;padding:9px 10px;transition:background .15s}
.fi:hover{background:var(--surface)}
.fi.on{background:var(--surface-2);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sel) 45%,transparent)}
.fi-bar{grid-row:1/3;align-self:stretch;border-radius:4px;background:var(--dom)}
.fi-bar.intl{background:var(--intl)}
.fi-main{display:flex;gap:10px;align-items:baseline;min-width:0}
.fi-main b{font-size:14px}
.fi-main span{font-size:13px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.fi-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fi-st{font-size:11.5px;font-weight:700;text-align:right;white-space:nowrap}
.fi-pr{width:64px;height:4px;border-radius:9px;background:var(--surface-3);justify-self:end;overflow:hidden}
.fi-pr i{display:block;height:100%;background:var(--sel);border-radius:9px}
.more{margin:8px 6px 0;border:1px dashed var(--line-2);background:none;border-radius:12px;padding:10px;color:var(--muted);font-weight:700;font-size:13px}
.more:hover{color:var(--text);border-color:var(--accent)}
.empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:13.5px}

/* ---------- pages ---------- */
.page{max-width:1240px;margin:0 auto;padding:40px clamp(16px,4vw,40px) 40px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.page h2{font-family:Unbounded,Manrope,sans-serif;font-weight:600;font-size:clamp(24px,3vw,36px);margin:0 0 6px;letter-spacing:-.015em;line-height:1.15}
.page .sub{color:var(--muted);margin:0;max-width:60ch}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .search{width:min(380px,100%)}
.count{margin-left:auto;color:var(--muted);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow:auto;border:1px solid var(--line-2);border-radius:18px;background:var(--surface);max-height:calc(100dvh - var(--hh,64px) - 240px);min-height:320px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{position:sticky;top:0;background:var(--surface);z-index:1;text-align:left;padding:0;border-bottom:1px solid var(--line-2)}
th button{border:0;background:none;display:flex;gap:6px;align-items:center;width:100%;padding:13px 14px;color:var(--muted);font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
th button:hover{color:var(--text)}
th[aria-sort] button{color:var(--accent)}
th .ar{opacity:.4;font-size:10px}
th[aria-sort] .ar{opacity:1}
td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover td,tbody tr:focus-visible td{background:var(--surface-2)}
tbody tr:focus-visible{outline:none}
tbody tr.on td{background:color-mix(in srgb,var(--sel) 9%,transparent)}
.iata{display:inline-block;font-weight:800;min-width:34px}
.mute{color:var(--muted)}
.kd{display:inline-flex;align-items:center;gap:7px}
.kd::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dom)}
.kd.intl::before{background:var(--intl)}
.ap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ap{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;transition:transform .2s,border-color .2s;display:flex;flex-direction:column;gap:10px}
.ap:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.ap-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ap-code{font-family:Unbounded,Manrope,sans-serif;font-size:24px;font-weight:600;line-height:1}
.ap-cc{font-size:11.5px;color:var(--muted);font-weight:700;text-align:right}
.ap-city{font-weight:700;font-size:15px;margin-top:-4px}
.ap-nums{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ap-nums div{background:var(--surface-2);border-radius:11px;padding:7px 10px}
.ap-nums span{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.ap-nums b{font-size:17px;font-variant-numeric:tabular-nums}
.ap-live{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600}
.ap-live b{color:var(--text);font-variant-numeric:tabular-nums}
.about{display:grid;gap:10px;max-width:860px}
.about details{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:border-color .2s}
.about details[open]{border-color:var(--line-2)}
.about summary{list-style:none;cursor:pointer;padding:18px 20px;font-weight:800;font-size:16px;display:flex;align-items:center;gap:14px}
.about summary::-webkit-details-marker{display:none}
.about summary .n{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font-size:13px;flex:none}
.about summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;margin-top:-4px}
.about details[open] summary::after{transform:rotate(-135deg);margin-top:4px}
.about .body{padding:0 20px 20px 64px;color:var(--muted);font-size:14.5px}
.about .body p{margin:0 0 10px}
.about .body ul,.about .body ol{margin:0 0 10px;padding-left:20px}
.about .body li{margin:4px 0}
.about .body b{color:var(--text)}
.about kbd{font:700 12px Manrope,sans-serif;background:var(--surface-2);border:1px solid var(--line-2);border-radius:6px;padding:1px 6px;color:var(--text)}
.lg-row{display:flex;align-items:center;gap:10px;margin:6px 0}
.sw{width:22px;height:4px;border-radius:4px;flex:none}
.sw.dash{background:repeating-linear-gradient(90deg,var(--sel) 0 5px,transparent 5px 9px)!important}
.foot{max-width:1240px;margin:0 auto;padding:22px clamp(16px,4vw,40px) 40px;color:var(--faint);font-size:12.5px;border-top:1px solid var(--line)}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .demo span{display:none}.demo{padding:7px}
  .feats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .top{flex-wrap:wrap;padding:10px 14px 4px;gap:8px 12px}
  .ctrls{margin-left:auto}
  .tabs{order:3;flex-basis:100%;justify-content:flex-start;margin:0 -4px}
  .hero-inner{grid-template-columns:1fr;gap:28px;padding-top:36px}
  .now-card{max-width:460px}
  .map-layout{display:block;height:auto}
  .map-wrap{height:62dvh;min-height:360px}
  .side{border-left:0;overflow:visible}
  .side-top{position:static}
  .tbl-wrap{max-height:none}
}
@media (max-width:560px){
  .brand-name small{display:none}
  .feats{grid-template-columns:1fr}
  .feat{padding:13px 14px}
  .legend{flex-direction:column;gap:4px;padding:7px 10px}
  .clock{font-size:11px}
  .layers{padding:8px}
  .times{grid-template-columns:1fr 1fr}
  .times .tm:last-child{grid-column:1/-1}
  .about .body{padding-left:20px}
  .count{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

<script>

/* ============================== utils ============================== */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

const my = lat => 1.25*Math.log(Math.tan(Math.PI/4 + 0.4*lat*D2R))/D2R;   // Miller projection, degree units
const Y_TOP = my(84), Y_BOT = my(-58);
const PLANE_D = 'M0,-10L1.6,-6L1.6,-2L10,3L10,5L1.6,2.6L1.2,7L4,9L4,10.5L0,9.6L-4,10.5L-4,9L-1.2,7L-1.6,2.6L-10,5L-10,3L-1.6,-2L-1.6,-6Z';
const PLANE = new Path2D(PLANE_D);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(20261006);
const pick = arr => arr[Math.floor(rnd()*arr.length)];
function pickW(arr,wf){let s=0;const ws=arr.map(x=>{const w=wf(x);s+=w;return w});let r=rnd()*s;for(let i=0;i<arr.length;i++){r-=ws[i];if(r<=0&&ws[i]>0)return arr[i]}return arr[arr.length-1]}
function gcDist(a,b){const p1=a.lat*D2R,p2=b.lat*D2R,dp=p2-p1,dl=(b.lon-a.lon)*D2R;const h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*6371*Math.asin(Math.min(1,Math.sqrt(h)))}
function gcInterp(a,b,f){
  const p1=a.lat*D2R,l1=a.lon*D2R,p2=b.lat*D2R,l2=b.lon*D2R;
  const d=2*Math.asin(Math.sqrt(Math.sin((p2-p1)/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin((l2-l1)/2)**2));
  if(d<1e-9)return[a.lat,a.lon];
  const A=Math.sin((1-f)*d)/Math.sin(d),B=Math.sin(f*d)/Math.sin(d);
  const x=A*Math.cos(p1)*Math.cos(l1)+B*Math.cos(p2)*Math.cos(l2);
  const y=A*Math.cos(p1)*Math.sin(l1)+B*Math.cos(p2)*Math.sin(l2);
  const z=A*Math.sin(p1)+B*Math.sin(p2);
  return[Math.atan2(z,Math.hypot(x,y))/D2R,Math.atan2(y,x)/D2R];
}

(function build(){
  const TOTAL = 460, used = new Set();
  const domKeys = Object.keys(DOM_W);

    if(dom){

function altAt(f,p){
  if(p<=0||p>=f.dur)return 0;
  if(p<f.climb){const u=p/f.climb;return f.alt*(1-(1-u)*(1-u))}
  if(p>f.dur-f.desc){const u=(f.dur-p)/f.desc;return f.alt*(1-(1-u)*(1-u))}
  return f.alt;
}
function spdAt(f,p){
  if(p<f.climb)return 290+(f.spd-290)*(p/f.climb);
  if(p>f.dur-f.desc)return 260+(f.spd-260)*((f.dur-p)/f.desc);
  return f.spd;
}
function updateState(f,t){
  const s=f.s, k=Math.floor((t-f.offset)/f.period);

  if(p<f.dur){
    s.air=true; s.p=p; s.frac=p/f.dur;
    s.st = p<f.climb?'climb':p>f.dur-f.desc?'descent':'cruise';
    const x=s.frac*(f.N-1), i=Math.min(f.N-2,Math.floor(x)), u=x-i;
    s.lon=f.px[i]+(f.px[i+1]-f.px[i])*u; s.y=f.py[i]+(f.py[i+1]-f.py[i])*u; s.lat=f.pl[i]+(f.pl[i+1]-f.pl[i])*u;
    s.ang=f.ang[i]; s.alt=altAt(f,p); s.spd=spdAt(f,p);
  }else{
    s.air=false; s.alt=0; s.spd=0;
    if(p<f.dur+LANDED){s.st='landed';s.p=p;s.frac=1;const j=f.N-1;s.lon=f.px[j];s.y=f.py[j];s.lat=f.pl[j]}

    s.ang=f.ang[0];
  }

}

function fmtDur(ms){const m=Math.max(0,Math.round(ms/MIN)),h=Math.floor(m/60),r=m%60;return h?`${h} ${t('u_h')} ${pad(r)} ${t('u_min')}`:`${r} ${t('u_min')}`}
function fmtCoord(lat,lon){lon=wrapLon(lon);const f=v=>Math.abs(v).toLocaleString(loc(),{minimumFractionDigits:2,maximumFractionDigits:2})+'°';return`${f(lat)} ${t(lat>=0?'N':'S')}, ${f(lon)} ${t(lon>=0?'E':'W')}`}
const ST_ORDER = {cruise:0,climb:1,descent:2,awaiting:3,landed:4};

let P = {};
function readPalette(){
  const cs=getComputedStyle(document.documentElement),g=n=>cs.getPropertyValue('--'+n).trim();
  P={ocean:g('ocean'),land:g('land'),coast:g('coast'),grid:g('grid'),airport:g('airport'),intl:g('intl'),dom:g('dom'),sel:g('sel'),text:g('text'),muted:g('muted'),surface:g('surface'),bg:g('bg')};

/* ============================== map view ============================== */
class MapView{
  constructor(canvas,hero){
    this.c=canvas;this.ctx=canvas.getContext('2d');this.hero=hero;
    this.w=0;this.h=0;this.k=0;this.dpr=1;
    this.cLon=hero?50:62;this.cY=my(hero?28:40);
    this.follow=false;this.hover=null;this.anim=null;this.pending=null;this.ptrs=new Map();this.moved=0;this.lastT=0;
    new ResizeObserver(()=>this.resize()).observe(canvas.parentElement);
    if(!hero)this.bind();
  }
  kMin(){return Math.max(this.w/360,this.h/(Y_TOP-Y_BOT))}
  resize(){
    const r=this.c.parentElement.getBoundingClientRect();
    if(r.width<2||r.height<2)return;
    this.w=r.width;this.h=r.height;this.dpr=Math.min(2,window.devicePixelRatio||1);
    this.c.width=Math.round(this.w*this.dpr);this.c.height=Math.round(this.h*this.dpr);
    const km=this.kMin();
    if(this.hero)this.k=km*1.15;else if(!this.k)this.k=km*1.3;
    if(this.pending){const[l,m,mul]=this.pending;this.pending=null;this.cLon=l;this.cY=m;this.k=Math.max(this.k,km*mul)}
    this.clamp();this.draw(performance.now());
  }
  clamp(){
    const km=this.kMin();this.k=clamp(this.k,km,km*60);
    this.cLon=wrapLon(this.cLon);
    const half=this.h/2/this.k,top=Y_TOP-half,bot=Y_BOT+half;
    this.cY=top<bot?(Y_TOP+Y_BOT)/2:clamp(this.cY,bot,top);
  }
  sx(lon,o){return(lon+o-this.cLon)*this.k+this.w/2}
  sy(y){return(y+this.cY)*this.k+this.h/2}
  offsets(minL,maxL){const L=this.cLon-this.w/2/this.k,R=this.cLon+this.w/2/this.k,o=[];for(let x=-1080;x<=1080;x+=360)if(maxL+x>=L&&minL+x<=R)o.push(x);return o}
  world(o){const d=this.dpr,k=this.k;this.ctx.setTransform(d*k,0,0,d*k,d*((o-this.cLon)*k+this.w/2),d*(this.cY*k+this.h/2))}
  screen(){this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0)}
  glyph(x,y,a,sz){const c=Math.cos(a)*sz/10*this.dpr,s=Math.sin(a)*sz/10*this.dpr;this.ctx.setTransform(c,s,-s,c,x*this.dpr,y*this.dpr);this.ctx.fill(PLANE)}
  flyTo(lon,m,mul,force){
    if(!this.w){this.pending=[lon,m,mul];return}
    const km=this.kMin(),k=clamp(force?km*mul:Math.max(this.k,km*mul),km,km*60);
    let l=lon;while(l-this.cLon>180)l-=360;while(l-this.cLon<-180)l+=360;
    if(RM){this.cLon=l;this.cY=m;this.k=k;this.clamp();return}
    this.anim={t0:performance.now(),d:800,l0:this.cLon,l1:l,y0:this.cY,y1:m,k0:this.k,k1:k};
  }
  zoomAt(sx,sy,f){
    const lon=this.cLon+(sx-this.w/2)/this.k,m=this.cY-(sy-this.h/2)/this.k;
    const km=this.kMin();this.k=clamp(this.k*f,km,km*60);
    this.cLon=lon-(sx-this.w/2)/this.k;this.cY=m+(sy-this.h/2)/this.k;this.clamp();
  }
  step(now){
    const dt=this.lastT?Math.min(100,now-this.lastT):16;this.lastT=now;
    if(this.anim){
      const a=this.anim;let u=clamp((now-a.t0)/a.d,0,1);u=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
      this.cLon=a.l0+(a.l1-a.l0)*u;this.cY=a.y0+(a.y1-a.y0)*u;this.k=Math.exp(Math.log(a.k0)+(Math.log(a.k1)-Math.log(a.k0))*u);
      if(u>=1)this.anim=null;this.clamp();
    }else if(this.follow&&S.sel&&S.sel.s.air){this.cLon=S.sel.s.lon;this.cY=-S.sel.s.y;this.clamp()}
    if(this.hero&&!RM){this.cLon-=dt*0.0012;this.clamp()}
  }
  draw(now){
    if(!this.w)return;
    const{ctx,w,h,k}=this,hero=this.hero,sel=hero?null:S.sel;
    this.screen();
    ctx.fillStyle=P.ocean;ctx.fillRect(0,0,w,h);
    // graticule
    ctx.strokeStyle=P.grid;ctx.lineWidth=1;ctx.beginPath();
    for(const o of this.offsets(-180,180))for(let lon=-180;lon<180;lon+=30){const x=Math.round(this.sx(lon,o))+.5;ctx.moveTo(x,0);ctx.lineTo(x,h)}
    for(let lat=-40;lat<=80;lat+=20){const y=Math.round(this.sy(-my(lat)))+.5;ctx.moveTo(0,y);ctx.lineTo(w,y)}
    ctx.stroke();
    // land
    for(const o of this.offsets(-180,180)){
      this.world(o);ctx.fillStyle=P.land;ctx.fill(LAND);ctx.fillStyle=P.ocean;ctx.fill(WATER);
      ctx.strokeStyle=P.coast;ctx.lineWidth=1/k;ctx.stroke(LAND);ctx.stroke(WATER);
    }
    // all routes
    if(hero||S.layers.routes){
      const L=this.cLon-w/2/k,R=this.cLon+w/2/k;
      ctx.lineWidth=1/k;
      if(hero&&!RM){ctx.setLineDash([3/k,8/k]);ctx.lineDashOffset=-(now/70)/k}
      for(const intl of [false,true]){
        ctx.strokeStyle=intl?P.intl:P.dom;ctx.globalAlpha=hero?.34:.2;
        for(let x=-720;x<=720;x+=360){
          let set=false;
          for(const f of FLIGHTS){
            if(f.intl!==intl||!f.s.air||(!f.match&&!hero)||f===sel)continue;
            if(f.maxL+x<L||f.minL+x>R)continue;
            if(!set){this.world(x);set=true}
            ctx.stroke(f.path);
          }
        }
      }
      ctx.globalAlpha=1;ctx.setLineDash([]);
    }
    this.screen();
    // airports
    if(hero||S.layers.airports){
      const lbl=!hero&&k>this.kMin()*2.4;
      ctx.font='700 10px Manrope,sans-serif';
      for(const a of AIRPORTS){
        const y=this.sy(a.y);if(y<-10||y>h+10)continue;
        for(let o=-720;o<=720;o+=360){
          const x=this.sx(a.lon,o);if(x<-10||x>w+10)continue;
          ctx.globalAlpha=hero?.45:.8;ctx.fillStyle=P.airport;
          ctx.beginPath();ctx.arc(x,y,a.w>2?2.6:1.9,0,6.2832);ctx.fill();
          if(lbl){ctx.globalAlpha=.75;ctx.fillStyle=P.muted;ctx.fillText(a.iata,x+5,y+3.5)}
        }
      }
      ctx.globalAlpha=1;
    }
    // planes
    const sz=clamp(4.3+Math.log2(k/this.kMin())*1.4,4.3,10);
    for(const f of FLIGHTS){
      const s=f.s;if(!s.air||f===sel)continue;
      const y=this.sy(s.y);if(y<-15||y>h+15)continue;
      ctx.fillStyle=f.intl?P.intl:P.dom;ctx.globalAlpha=hero?.9:f.match?1:.13;
      for(let o=-720;o<=720;o+=360){const x=this.sx(s.lon,o);if(x<-15||x>w+15)continue;this.glyph(x,y,s.ang,sz)}
    }
    ctx.globalAlpha=1;this.screen();
    // hover ring
    const hv=this.hover;
    if(hv&&hv.f&&hv.f.s.air&&hv.f!==sel){
      const y=this.sy(hv.f.s.y);ctx.strokeStyle=P.text;ctx.globalAlpha=.55;ctx.lineWidth=1.5;
      for(const o of [-360,0,360]){const x=this.sx(hv.f.s.lon,o);if(x<-20||x>w+20)continue;ctx.beginPath();ctx.arc(x,y,sz+6,0,6.2832);ctx.stroke()}
      ctx.globalAlpha=1;
    }
    if(sel)this.drawSel(sel,sz);
  }
  drawSel(f,sz){
    const{ctx}=this,s=f.s,N=f.N;
    const idx=s.st==='landed'?N-1:s.air?s.frac*(N-1):0,i=Math.min(N-1,Math.floor(idx));
    ctx.lineCap='round';ctx.lineJoin='round';
    for(const o of this.offsets(Math.min(f.minL,s.lon)-5,Math.max(f.maxL,s.lon)+5)){
      const cx=this.sx(s.lon,o),cy=this.sy(s.y);
      if(idx>0){
        ctx.beginPath();ctx.moveTo(this.sx(f.px[0],o),this.sy(f.py[0]));
        for(let j=1;j<=i;j++)ctx.lineTo(this.sx(f.px[j],o),this.sy(f.py[j]));
        ctx.lineTo(cx,cy);ctx.strokeStyle=P.sel;ctx.lineWidth=2.6;ctx.stroke();
      }
      if(idx<N-1){
        ctx.beginPath();ctx.moveTo(cx,cy);
        for(let j=i+1;j<N;j++)ctx.lineTo(this.sx(f.px[j],o),this.sy(f.py[j]));
        ctx.setLineDash([5,6]);ctx.strokeStyle=P.sel;ctx.globalAlpha=.8;ctx.lineWidth=1.8;ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
      }
      ctx.font='800 11px Manrope,sans-serif';
      for(const[a,j]of[[f.from,0],[f.to,N-1]]){
        const x=this.sx(f.px[j],o),y=this.sy(f.py[j]);
        ctx.beginPath();ctx.arc(x,y,4.5,0,6.2832);ctx.fillStyle=P.surface;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=P.sel;ctx.stroke();
        const tw=ctx.measureText(a.iata).width,bx=x+9,by=y-10;
        ctx.fillStyle=P.surface;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(bx,by,tw+12,20,6);else ctx.rect(bx,by,tw+12,20);ctx.fill();
        ctx.strokeStyle=hexA(P.sel,.5);ctx.lineWidth=1;ctx.stroke();
        ctx.fillStyle=P.text;ctx.fillText(a.iata,bx+6,by+14);
      }
      if(s.air){
        const g=ctx.createRadialGradient(cx,cy,0,cx,cy,sz*3.6);g.addColorStop(0,P.selGlow);g.addColorStop(1,hexA(P.sel,0));
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,sz*3.6,0,6.2832);ctx.fill();
        ctx.fillStyle=P.sel;this.glyph(cx,cy,s.ang,sz*1.6);this.screen();
      }
    }
  }
  hitFlight(x,y){
    let best=null,bd=15*15;
    for(const f of FLIGHTS){
      if(!f.s.air)continue;const yy=this.sy(f.s.y);if(Math.abs(yy-y)>15)continue;
      for(let o=-720;o<=720;o+=360){const xx=this.sx(f.s.lon,o);const d=((xx-x)**2+(yy-y)**2)*(f.match?1:4);if(d<bd){bd=d;best=f}}
    }
    return best;
  }
  hitAirport(x,y){
    if(!S.layers.airports)return null;let best=null,bd=9*9;
    for(const a of AIRPORTS){const yy=this.sy(a.y);if(Math.abs(yy-y)>9)continue;for(let o=-720;o<=720;o+=360){const d=(this.sx(a.lon,o)-x)**2+(yy-y)**2;if(d<bd){bd=d;best=a}}}
    return best;
  }
  bind(){
    const c=this.c,tip=$('#tip');
    const pos=e=>{const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
    c.addEventListener('pointerdown',e=>{
      c.setPointerCapture(e.pointerId);this.ptrs.set(e.pointerId,pos(e));this.anim=null;
      if(this.ptrs.size===1)this.moved=0;
      if(this.ptrs.size===2)this.pinch=this.pinchInfo();
    });
    c.addEventListener('pointermove',e=>{
      const p=pos(e),prev=this.ptrs.get(e.pointerId);
      if(!prev){this.hoverAt(p.x,p.y);return}
      if(this.ptrs.size===1){
        const dx=p.x-prev.x,dy=p.y-prev.y;this.moved+=Math.abs(dx)+Math.abs(dy);
        if(this.moved>4){c.classList.add('drag');tip.hidden=true;this.cLon-=dx/this.k;this.cY+=dy/this.k;this.clamp();if(this.follow)setFollow(false)}
        this.ptrs.set(e.pointerId,p);
      }else if(this.ptrs.size===2){
        this.ptrs.set(e.pointerId,p);const n=this.pinchInfo(),o=this.pinch;
        if(o){this.zoomAt(n.x,n.y,n.d/o.d);this.cLon-=(n.x-o.x)/this.k;this.cY+=(n.y-o.y)/this.k;this.clamp();if(this.follow)setFollow(false)}
        this.pinch=n;this.moved+=10;
      }
    });
    const end=e=>{
      if(!this.ptrs.has(e.pointerId))return;
      this.ptrs.delete(e.pointerId);if(this.ptrs.size<2)this.pinch=null;
      if(this.ptrs.size===0){c.classList.remove('drag');if(this.moved<=4&&e.type==='pointerup'){const p=pos(e);this.click(p.x,p.y)}}
    };
    c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
    c.addEventListener('pointerleave',()=>{if(!this.ptrs.size){this.hover=null;tip.hidden=true}});
    c.addEventListener('wheel',e=>{e.preventDefault();const p=pos(e);this.anim=null;this.zoomAt(p.x,p.y,Math.exp(-e.deltaY*(e.deltaMode===1?0.05:0.0017)))},{passive:false});
    c.addEventListener('keydown',e=>{
      const st=80/this.k;let used=true;
      switch(e.key){
        case'ArrowLeft':this.cLon-=st;break;case'ArrowRight':this.cLon+=st;break;
        case'ArrowUp':this.cY+=st;break;case'ArrowDown':this.cY-=st;break;
        case'+':case'=':this.zoomAt(this.w/2,this.h/2,1.4);break;case'-':case'_':this.zoomAt(this.w/2,this.h/2,1/1.4);break;
        case'Escape':selectFlight(null);break;default:used=false;
      }
      if(used){e.preventDefault();this.anim=null;this.clamp();if(e.key.startsWith('Arrow')&&this.follow)setFollow(false)}
    });
  }
  pinchInfo(){const[a,b]=[...this.ptrs.values()];return{x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.hypot(a.x-b.x,a.y-b.y)||1}}
  click(x,y){
    const f=this.hitFlight(x,y);if(f){selectFlight(f,false);return}
    const a=this.hitAirport(x,y);if(a){setQuery(a.iata)}
  }
  hoverAt(x,y){
    const tip=$('#tip'),f=this.hitFlight(x,y),a=f?null:this.hitAirport(x,y);
    this.hover=f?{f}:a?{a}:null;this.c.classList.toggle('ptr',!!this.hover);
    if(!this.hover){tip.hidden=true;return}
    if(f){const s=f.s;tip.innerHTML=`<b>${f.code}</b> · ${alName(f.al)}<br><b>${f.from.iata}</b> ${city(f.from)} → <b>${f.to.iata}</b> ${city(f.to)}<br>${t('st_'+s.st)} · ${fmtN(Math.round(s.alt/10)*10)} ${t('u_m')} · ${fmtN(s.spd)} ${t('u_kmh')}`}
    else tip.innerHTML=`<b>${a.iata}</b> · ${city(a)}, ${country(a)}<br>${t('ap_deps')}: <b>${a.deps}</b> · ${t('ap_arrs')}: <b>${a.arrs}</b>`;
    tip.hidden=false;
    const tw=tip.offsetWidth,th=tip.offsetHeight;
    tip.style.left=(x+14+tw>this.w?x-14-tw:x+14)+'px';tip.style.top=clamp(y+14,4,this.h-th-4)+'px';
  }
}

const norm = s=>s.toLowerCase().trim();
function applyFilter(){
  const q=norm(S.q),qn=q.replace(/\s+/g,'');
  for(const f of FLIGHTS)f.match=(S.kind==='all'||(S.kind==='intl')===f.intl)&&(!q||f.hay.includes(q)||f.hayNS.includes(qn));
  $$('.q-input').forEach(i=>{if(i.value!==S.q)i.value=S.q});
  $$('[data-act="clearq"]').forEach(b=>b.hidden=!S.q);
  $$('[data-kind]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.kind===S.kind));
  renderList();if(S.tab==='flights')renderTable();
}
function setQuery(q){S.q=q;applyFilter()}
function setKind(k){S.kind=k;applyFilter()}

function selectFlight(f,reveal){
  S.sel=f||null;mapView.follow=false;
  renderDash();markSel();
  if(f&&reveal)mapView.flyTo(f.s.lon,-f.s.y,2.6);
}
function openFlight(f){goTab('map');selectFlight(f,true)}
function openAirport(a){S.kind='all';setQuery(a.iata);goTab('map');selectFlight(null);mapView.flyTo(a.lon,-a.y,3.4,true)}
function setFollow(v){
  mapView.follow=!!(v&&S.sel);
  const b=$('[data-act="follow"]');if(b){b.setAttribute('aria-pressed',mapView.follow);b.querySelector('span').textContent=t(mapView.follow?'following':'follow')}
  if(mapView.follow&&S.sel)mapView.flyTo(S.sel.s.lon,-S.sel.s.y,2.6);
}
function markSel(){
  $$('#flist .fi').forEach(el=>el.classList.toggle('on',S.sel&&+el.dataset.flight===S.sel.id));
  $$('#tbody tr').forEach(el=>el.classList.toggle('on',S.sel&&+el.dataset.flight===S.sel.id));
}

const PW=300,PH=64,PMAX=13000;
const profY = alt=>PH-3-(alt/PMAX)*(PH-10);
function profileSVG(f){
  let d='';for(let j=0;j<=80;j++){const p=f.dur*j/80;d+=(j?'L':'M')+(PW*j/80).toFixed(1)+','+profY(altAt(f,p)).toFixed(1)}
  return`<svg viewBox="0 0 ${PW} ${PH}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sel);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--sel);stop-opacity:0"/></linearGradient></defs><path d="${d}L${PW},${PH}L0,${PH}Z" fill="url(#pg)"/><path d="${d}" style="fill:none;stroke:var(--sel)" stroke-width="1.6" vector-effect="non-scaling-stroke"/><line data-d="pline" x1="0" x2="0" y1="0" y2="${PH}" style="stroke:var(--text);stroke-opacity:.35" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"/></svg>`;
}
function updateDash(){
  const f=S.sel;if(!f)return;const s=f.s,el=$('#dash'),D=k=>el.querySelector(`[data-d="${k}"]`);
  if(!D('st'))return;
  const st=D('st');st.className='pill st-'+s.st;st.textContent=t('st_'+s.st);
  const pct=s.frac*100;D('bar').style.width=pct+'%';D('dot').style.left=pct+'%';
  D('flown').textContent=fmtN(f.dist*s.frac)+' '+t('u_km');D('left').textContent=fmtN(f.dist*(1-s.frac))+' '+t('u_km');D('pct').textContent=Math.floor(pct)+'%';
  D('depU').innerHTML=hmUTC(s.dep)+'<small>UTC</small>';D('depL').textContent=`${dayUTC(s.dep)} · ${hmLocal(s.dep)} ${t('yours')}`;
  D('arrU').innerHTML=hmUTC(s.arr)+'<small>UTC</small>';D('arrL').textContent=`${dayUTC(s.arr)} · ${hmLocal(s.arr)} ${t('yours')}`;
  if(s.air){D('remL').textContent=t('remain');D('rem').textContent=fmtDur(f.dur-s.p);D('remS').textContent=fmtDur(s.p)+' '+t('elapsed')}
  else if(s.st==='landed'){D('remL').textContent=t('since_land');D('rem').textContent=fmtDur(s.p-f.dur);D('remS').textContent=t('ago')}
  else{D('remL').textContent=t('to_dep');D('rem').textContent=fmtDur(-s.p);D('remS').textContent=fmtDur(f.dur)+' '+t('elapsed')}
  if(s.air){
    D('alt').textContent=fmtN(Math.round(s.alt/10)*10)+' '+t('u_m');D('altS').textContent='FL'+String(Math.round(s.alt*3.28084/100)).padStart(3,'0');
    D('spd').textContent=fmtN(s.spd)+' '+t('u_kmh');D('spdS').textContent=fmtN(s.spd*.539957)+' '+t('u_kt');
    const hd=bearing(s.lat,wrapLon(s.lon),f.to.lat,f.to.lon);D('hdg').textContent=Math.round(hd)+'°';D('hdgS').textContent=t('compass')[Math.round(hd/45)%8];
  }else{for(const k of['alt','spd','hdg'])D(k).textContent='—';for(const k of['altS','spdS','hdgS'])D(k).textContent=t('st_'+s.st)}
  D('pos').textContent=fmtCoord(s.lat,s.lon);
  const x=s.frac*PW;const pl=D('pline');pl.setAttribute('x1',x);pl.setAttribute('x2',x);
  const pd=D('pdot');pd.style.left=(s.frac*100)+'%';pd.style.top=(profY(s.air?s.alt:0)/PH*100)+'%';
}

function counts(){let a=0,i=0;for(const f of FLIGHTS)if(f.s.air){a++;if(f.intl)i++}return{a,i,d:a-i}}
function updateCounts(){const c=counts();$('#cA').textContent=fmtN(c.a);$('#cI').textContent=fmtN(c.i);$('#cD').textContent=fmtN(c.d);return c}

const LIST_LIM=60;

function renderList(){
  const arr=sortedMatches(),el=$('#flist');

  if(!arr.length){el.innerHTML=`<div class="empty">${t('list_empty')}</div>`;return}
  el.innerHTML=arr.slice(0,LIST_LIM).map(f=>{const s=f.s;return`<button class="fi${f===S.sel?' on':''}" data-flight="${f.id}">
    <i class="fi-bar${f.intl?' intl':''}"></i>
    <span class="fi-main"><b>${f.code}</b><span>${f.from.iata} → ${f.to.iata}</span></span>

const COLS=[['code','th_code'],['airline','th_airline'],['from','th_from'],['to','th_to'],['dep','th_dep'],['arr','th_arr'],['st','th_st'],['alt','th_alt'],['kind','th_kind']];
const SORTERS={code:f=>f.code,airline:f=>alName(f.al),from:f=>city(f.from),to:f=>city(f.to),dep:f=>f.s.dep,arr:f=>f.s.arr,st:f=>ST_ORDER[f.s.st],alt:f=>-f.s.alt,kind:f=>f.intl?0:1};
function renderHead(){
  $('#thead').innerHTML=COLS.map(([k,l])=>{const on=S.sort.key===k;return`<th${on?` aria-sort="${S.sort.dir>0?'ascending':'descending'}"`:''}><button data-sort="${k}">${t(l)}<span class="ar">${on?(S.sort.dir>0?'▲':'▼'):'↕'}</span></button></th>`}).join('');
}
function renderTable(){
  const fn=SORTERS[S.sort.key],dir=S.sort.dir;
  const arr=FLIGHTS.filter(f=>f.match).sort((a,b)=>{const x=fn(a),y=fn(b);const c=typeof x==='string'?x.localeCompare(y,loc(),{numeric:true}):x-y;return c*dir||a.code.localeCompare(b.code,'en',{numeric:true})});
  $('#tblCount').textContent=t('shown',{n:fmtN(arr.length)});
  $('#tbody').innerHTML=arr.length?arr.map(f=>{const s=f.s;return`<tr data-flight="${f.id}" tabindex="0"${f===S.sel?' class="on"':''}>

function liveAirports(){for(const a of AIRPORTS){a.liveD=0;a.liveA=0}for(const f of FLIGHTS)if(f.s.air){f.from.liveD++;f.to.liveA++}}

const NOW={f:null,t:0};
function pickNow(){
  const c=FLIGHTS.filter(f=>f.s.air&&f.s.st==='cruise'&&f.s.frac>.12&&f.s.frac<.8&&f!==NOW.f);
  NOW.f=c.length?c[Math.floor(Math.random()*c.length)]:FLIGHTS.find(f=>f.s.air)||null;NOW.t=performance.now();renderNow();
}
function renderNow(){
  const f=NOW.f,el=$('#nowBody');if(!f){el.innerHTML='';return}
  el.innerHTML=`<div class="now-flight"><b>${f.code}</b><span>${alName(f.al)} · ${f.type}</span></div>
  <div class="now-route"><div><div class="code">${f.from.iata}</div><div class="city">${city(f.from)}</div></div><div class="now-arc">${planeSVG(90)}</div><div class="r"><div class="code">${f.to.iata}</div><div class="city">${city(f.to)}</div></div></div>
  <div class="bar"><i data-n="bar"></i></div>
  <div class="now-stats"><div><span>${t('alt')}</span><b data-n="alt"></b></div><div><span>${t('spd')}</span><b data-n="spd"></b></div><div><span>${t('remain')}</span><b data-n="rem"></b></div></div>
  <button class="btn primary sm" data-flight="${f.id}">${t('now_open')} →</button>`;

}
function updateNow(){
  const f=NOW.f;if(!f)return;const s=f.s,el=$('#nowBody'),N=k=>el.querySelector(`[data-n="${k}"]`);if(!N('bar'))return;
  N('bar').style.width=(s.frac*100)+'%';

  N('spd').textContent=s.air?fmtN(s.spd)+' '+t('u_kmh'):'—';
  N('rem').textContent=s.air?fmtDur(f.dur-s.p):t('st_'+s.st);
}
function updateHome(){
  const c=counts();$('#hsAir').textContent=fmtN(c.a);$('#hsIntl').textContent=fmtN(c.i);$('#hsDom').textContent=fmtN(c.d);$('#hsAp').textContent=fmtN(AIRPORTS.length);
  if(!NOW.f||!NOW.f.s.air||performance.now()-NOW.t>12000)pickNow();else updateNow();
}
function updateClock(){
  const d=new Date(SIM.t);
  $('#clock').innerHTML=`${t('model_time')} · <b>${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}</b> UTC · ${S.speed}×`;
}

const TABS=['home','map','flights','airports','about'];
function goTab(name,focus){
  if(!TABS.includes(name))name='home';
  const changed=S.tab!==name;S.tab=name;
  for(const n of TABS){const b=$('#tab-'+n),on=n===name;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;$('#panel-'+n).hidden=!on}
  if(location.hash.slice(1)!==name){try{history.replaceState(null,'','#'+name)}catch(e){location.hash=name}}
  if(name==='map'){renderList();updateClock()}
  if(name==='flights')renderTable();
  if(name==='airports')renderAirports();
  if(name==='home')updateHome();
  if(focus)$('#tab-'+name).focus();
  if(changed||name==='map')window.scrollTo(0,0);
}

function applyLang(){
  document.documentElement.lang=S.lang;document.title=t('doc_title');
  $$('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  $$('[data-i18n-html]').forEach(el=>el.innerHTML=t(el.dataset.i18nHtml));
  $$('[data-i18n-ph]').forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  $$('[data-i18n-title]').forEach(el=>el.title=t(el.dataset.i18nTitle));
  $$('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.i18nAria)));
  $$('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===S.lang));
  renderDash();renderList();renderHead();renderAbout();renderNow();updateHome();updateClock();
  if(S.tab==='flights')renderTable();if(S.tab==='airports')renderAirports();
}
function setLang(l){S.lang=l;store.set('sp_lang',l);applyLang()}
function setTheme(th){S.theme=th;document.documentElement.dataset.theme=th;store.set('sp_theme',th);readPalette()}
function setSpeed(v){S.speed=v;$$('[data-speed]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.speed===v));updateClock()}

function doAct(a){
  switch(a){
    case'theme':setTheme(S.theme==='dark'?'light':'dark');break;
    case'clearq':setQuery('');$$('.q-input').find(i=>i.offsetParent)?.focus();break;
    case'close':selectFlight(null);break;
    case'show':if(S.sel){mapView.flyTo(S.sel.s.lon,-S.sel.s.y,3.2);if(innerWidth<=900)$('#mapWrap').scrollIntoView({behavior:RM?'auto':'smooth'})}break;
    case'follow':setFollow(!mapView.follow);break;
    case'random':{const c=FLIGHTS.filter(f=>f.s.air&&f.match);if(c.length)selectFlight(c[Math.floor(Math.random()*c.length)],true);break}
    case'zin':mapView.anim=null;mapView.zoomAt(mapView.w/2,mapView.h/2,1.6);break;
    case'zout':mapView.anim=null;mapView.zoomAt(mapView.w/2,mapView.h/2,1/1.6);break;
    case'zreset':setFollow(false);mapView.flyTo(mapView.cLon,(Y_TOP+Y_BOT)/2,1,true);break;
  }
}

/* ============================== events ============================== */
document.addEventListener('click',e=>{
  const T=e.target;let el;
  if((el=T.closest('[data-tab]'))){goTab(el.dataset.tab);return}
  if((el=T.closest('[data-go]'))){e.preventDefault();goTab(el.dataset.go);return}
  if((el=T.closest('[data-flight]'))){openFlight(FLIGHTS[+el.dataset.flight]);return}
  if((el=T.closest('[data-airport]'))){openAirport(APX[el.dataset.airport]);return}
  if((el=T.closest('[data-act]'))){doAct(el.dataset.act);return}
  if((el=T.closest('[data-kind]'))){setKind(el.dataset.kind);return}
  if((el=T.closest('[data-speed]'))){setSpeed(+el.dataset.speed);return}
  if((el=T.closest('[data-sort]'))){const k=el.dataset.sort;S.sort=S.sort.key===k?{key:k,dir:-S.sort.dir}:{key:k,dir:1};renderHead();renderTable();return}
  if((el=T.closest('[data-lang]'))){setLang(el.dataset.lang);return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('tr[data-flight]')){openFlight(FLIGHTS[+e.target.dataset.flight]);return}
  if(e.key==='Escape'&&S.tab==='map'&&S.sel&&!e.target.matches('input')){selectFlight(null)}
});
$('#tablist').addEventListener('keydown',e=>{
  if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft'&&e.key!=='Home'&&e.key!=='End')return;
  e.preventDefault();const i=TABS.indexOf(S.tab);
  const n=e.key==='Home'?0:e.key==='End'?TABS.length-1:(i+(e.key==='ArrowRight'?1:-1)+TABS.length)%TABS.length;
  goTab(TABS[n],true);
});
$$('.q-input').forEach(i=>i.addEventListener('input',()=>setQuery(i.value)));
$('#apq').addEventListener('input',renderAirports);
$('#lyRoutes').addEventListener('change',e=>S.layers.routes=e.target.checked);
$('#lyAirports').addEventListener('change',e=>S.layers.airports=e.target.checked);
addEventListener('hashchange',()=>goTab(location.hash.slice(1)));
new ResizeObserver(()=>document.documentElement.style.setProperty('--hh',$('#top').offsetHeight+'px')).observe($('#top'));

/* ============================== boot ============================== */
$('#logoPlane').setAttribute('d',PLANE_D);
$$('path.pl').forEach(p=>{p.setAttribute('d',PLANE_D);p.setAttribute('transform','rotate(45)')});
readPalette();
for(const f of FLIGHTS)updateState(f,SIM.t);
const heroView=new MapView($('#heroCanvas'),true);
const mapView=new MapView($('#mapCanvas'),false);
setSpeed(30);applyFilter();applyLang();
goTab(location.hash.slice(1)||'home');

let last=performance.now(),tUi=0,tSlow=0,tTable=0,tHero=0;
function frame(now){
  const dt=Math.min(250,now-last);last=now;
  SIM.t+=dt*S.speed;
  for(const f of FLIGHTS)updateState(f,SIM.t);
  if(S.tab==='map'){mapView.step(now);mapView.draw(now)}
  else if(S.tab==='home'&&(!RM||now-tHero>1000)){heroView.step(now);heroView.draw(now);tHero=now}
  if(now-tUi>250){tUi=now;if(S.tab==='map'){updateDash();updateClock()}}
  if(now-tSlow>1000){tSlow=now;updateCounts();if(S.tab==='map'&&!$('#flist').matches(':hover'))renderList();if(S.tab==='home')updateHome();if(S.tab==='airports')updateAirportsLive()}
  if(now-tTable>2500){tTable=now;if(S.tab==='flights'&&!$('#tbody').matches(':hover'))renderTable()}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
